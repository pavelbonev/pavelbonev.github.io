<!-- The invite's link (README "Поканата"): 404.html sends .../j/K7M3QP here as join.html#K7M3QP. -->
<main class="join">
  <div class="wrap">
    <h1>Du bist zu einem Spiel eingeladen</h1>
    <div class="code-card" id="code-card" hidden>
      <span class="code-label">Raumcode</span>
      <span class="code" id="code"></span>
    </div>
    <p class="how" id="how">Öffne NEARena, tippe auf „Raum beitreten“ und gib den Code ein.</p>
    <p class="how" id="ios" hidden>NEARena gibt es vorerst nur für Android.</p>
    <div class="cta" id="get">
      <a class="btn btn-cyan" id="open" hidden><span>NEARena öffnen</span></a>
      <a class="btn btn-tonal" href="https://play.google.com/store/apps/details?id=com.simplia.nearena&amp;hl=de">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 2.8v18.4c0 .6.6 1 1.2.7l15.4-8.9c.5-.3.5-1.1 0-1.4L5.2 2.1C4.6 1.8 4 2.2 4 2.8z"/></svg>
        Jetzt bei Google Play
      </a>
    </div>
  </div>
</main>

<script>
// The code as RoomCode reads it (the app's letters, without dashes and spaces), shown as K7M-3QP. On Android the
// button opens the app with the invite's link (it goes to Google Play when NEARena is not installed); an iPhone
// gets a line that the app is Android only for now instead of the way into the app. The language menu keeps the code.
(function () {
  var LETTERS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var code = decodeURIComponent(location.hash.slice(1)).toUpperCase().replace(/[\s._-]/g, '');
  for (var i = 0; i < code.length; i++) {
    if (LETTERS.indexOf(code.charAt(i)) < 0) code = '';
  }
  if (code.length !== 6) code = '';
  if (code) {
    document.getElementById('code').textContent = code.slice(0, 3) + '-' + code.slice(3);
    document.getElementById('code-card').hidden = false;
    var links = document.querySelectorAll('.lang-menu a');
    for (var j = 0; j < links.length; j++) links[j].href = links[j].getAttribute('href') + '#' + code;
  }
  // an iPad says Macintosh, but has a touch screen
  if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)) {
    document.getElementById('how').hidden = true;
    document.getElementById('get').hidden = true;
    document.getElementById('ios').hidden = false;
  } else if (/Android/i.test(navigator.userAgent)) {
    var open = document.getElementById('open');
    open.href = 'intent://pavelbonev.github.io/nearena/j/' + code
        + '#Intent;scheme=https;package=com.simplia.nearena;end';
    open.hidden = false;
  }
})();
</script>
