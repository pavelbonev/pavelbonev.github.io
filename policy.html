<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy policy · Euromondo</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://pavelbonev.github.io/privacy.html">
<script>
// The old address of the privacy policy: go on to the new one, in the browser's language.
(function () {
  var langs = navigator.languages || [navigator.language || 'en'];
  for (var i = 0; i < langs.length; i++) {
    var lang = String(langs[i]).slice(0, 2).toLowerCase();
    if (lang === 'en') break;
    if (["bg", "de", "es", "fr", "it", "pt"].indexOf(lang) >= 0) {
      location.replace(lang + '/privacy.html');
      return;
    }
  }
  location.replace('privacy.html');
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=privacy.html"></noscript>
</head>
<body style="background: #1A1A1A; font-family: system-ui, sans-serif">
<p><a href="privacy.html" style="color: #E53333">Privacy policy</a></p>
</body>
</html>
